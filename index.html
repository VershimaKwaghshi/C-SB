function header(kicker,title,desc,button=''){return `<div class="page-head"><div><p class="kicker">${kicker}</p><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function chart(){return `<div class="chart"><svg viewBox="0 0 700 175" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b7f34a" stop-opacity=".35"/><stop offset="1" stop-color="#b7f34a" stop-opacity="0"/></linearGradient></defs><path d="M0 142 C40 133 55 145 87 124 S135 135 165 108 S202 113 235 120 S280 81 314 96 S360 75 397 90 S435 48 469 68 S520 57 548 78 S594 26 620 47 S666 40 700 11 V175 H0Z" fill="url(#fill)"/><path d="M0 142 C40 133 55 145 87 124 S135 135 165 108 S202 113 235 120 S280 81 314 96 S360 75 397 90 S435 48 469 68 S520 57 548 78 S594 26 620 47 S666 40 700 11" fill="none" stroke="#8ccf35" stroke-width="3" stroke-linecap="round"/></svg></div><div class="chart-labels"><span>07 Sep</span><span>14 Sep</span><span>21 Sep</span><span>28 Sep</span><span>04 Oct</span></div>`}
function overview(){return `${header('PORTFOLIO CONTROL ROOM','Keep the account assignment intact.','A live view of account health, recovery available amount, and the decisions that still need a human.','<button class="primary-btn lime-btn" onclick="openCaseModal()">+ Open recovery case</button>')}<div class="grid kpi-grid"><div class="panel kpi"><span class="kpi-label">ACCOUNT ACCOUNT ASSIGNMENTS</span><div class="kpi-value">07</div><span class="kpi-meta"><b class="up">+1</b> this month</span></div><div class="panel kpi"><span class="kpi-label">TOTAL ACCOUNT EQUITY</span><div class="kpi-value">$387.7k</div><span class="kpi-meta"><b class="up">+2.8%</b> vs last period</span></div><div class="panel kpi"><span class="kpi-label">RECOVERY AVAILABLE AMOUNT</span><div class="kpi-value">$12.48k</div><span class="kpi-meta">5 eligible origins · notional excluded</span></div><div class="panel kpi"><span class="kpi-label">OPEN RISK EVENTS</span><div class="kpi-value">03</div><span class="kpi-meta"><b class="down">1 critical</b> · 2 watch</span></div></div><div class="grid section-grid"><section class="panel chart-panel"><div class="panel-head"><div><h3>Total account equity</h3><p>Realized + marked-to-market, last 30 days</p></div><div class="mini-legend"><span><i style="background:#8ccf35"></i>Equity</span><span><i style="background:#cad3dc"></i>Baseline</span></div></div><div class="chart-wrap">${chart()}</div></section><section class="panel risk-panel"><div class="panel-head"><div><h3>Needs attention</h3><p>Prioritized by severity</p></div><button class="secondary-btn" onclick="setView('conflicts')">View all</button></div><div class="alert"><div class="alert-mark red">!</div><div><strong>Recovery case requires review</strong><p>ACC-006 crossed the major-loss threshold.</p><a onclick="setView('recovery')">Open case →</a></div></div><div class="alert"><div class="alert-mark amber">△</div><div><strong>Pair conflict detected</strong><p>EUR/USD overlap across ACC-001 & ACC-003.</p><a onclick="setView('conflicts')">Inspect conflict →</a></div></div><div class="alert"><div class="alert-mark amber">◷</div><div><strong>Consent state pending</strong><p>Broker activity rebate cannot be allocated yet.</p><a onclick="setView('earnings')">Review ledger →</a></div></div></section></div><section class="panel accounts-panel"><div class="panel-head"><div><h3>Managed accounts</h3><p>Account assignments first. Balances second.</p></div><button class="secondary-btn" onclick="setView('accounts')">Open accounts →</button></div>${accountTable(accounts.slice(0,4))}</section>`}
function accountTable(rows){return `<div class="table-wrap"><table><thead><tr><th>ACCOUNT</th><th>PARTNER / ORIGIN</th><th>INITIAL EQUITY</th><th>RETURN</th><th>DRAWDOWN</th><th>STATUS</th></tr></thead><tbody>${rows.map(a=>`<tr onclick="openAccount('${a.id}')"><td><div class="acct-name"><span class="acct-avatar">${a.initials}</span><span>${a.name}<span class="acct-sub">${a.id} · ${a.owner}</span></span></div></td><td>${a.partner}<span class="acct-sub">${a.strategy}</span></td><td><b>${money(a.initialEquity)}</b><span class="acct-sub">current ${money(a.equity)}</span></td><td class="${a.return[0]==='+'?'up':'down'}">${a.return}</td><td>${a.drawdown}</td><td>${status(a.status)}</td></tr>`).join('')}</tbody></table></div>`}
function accountsView(){let rows=accounts.filter(a=>(a.name+a.owner+a.partner+a.id).toLowerCase().includes(query.toLowerCase()));return `${header('ACCOUNT ASSIGNMENT GRAPH','Managed accounts','Seven potential account account assignments under one monitored account set.','<button class="primary-btn" onclick="toast(\'Account account assignment form ready\')">+ Add account assignment</button>')}<div class="filterbar"><input id="accountSearch" placeholder="Search accounts, managers, partners..." value="${query}" oninput="query=this.value;render()"><select onchange="toast('Filter applied to demo view')"><option>All statuses</option><option>Healthy</option><option>Watch</option><option>At risk</option></select><span class="spacer"></span><span class="kpi-meta">${rows.length} of 7 account assignments</span></div><section class="panel accounts-panel">${rows.length?accountTable(rows):'<div class="empty"><strong>No account account assignments found</strong>Try a different search term.</div>'}</section>`}
function purchaseView(){return `${header('ACCOUNT ACQUISITION','Primary account + account set available amount','Purchase or activate the primary account assignment first. Additional accounts are created progressively through the C&SB account set — not sold as separate account packages.','<span class="demo-pill"><i></i> MOCK ACCOUNT FLOW</span>')}<div class="panel" style="padding:15px 18px;margin-bottom:16px;background:#fffced;border-color:#f1dfac"><strong>How the $1,000 equity basis works</strong><p class="kpi-meta" style="margin:5px 0 0">The primary account starts with $1,000 initial equity. Each additional C&SB account account assignment and the potential sub-management account carries the same $1,000 initial-equity basis in this demo. The five additional slots are available amount for account set growth, not an upfront promise that all five exist.</p></div><div class="grid two-col"><article class="panel purchase-card featured"><span class="featured-label">PRIMARY ACCOUNT ASSIGNMENT</span><span class="case-id">CORE ACCOUNT · ACC-001</span><h3>Primary C&SB account</h3><div class="purchase-price">$1,000<small>initial equity basis</small></div><div class="purchase-feature">✓ Original 50/50 account</div><div class="purchase-feature">✓ Primary manager / participant record</div><div class="purchase-feature">✓ Recovery and earnings ledger managed</div><button class="primary-btn lime-btn" onclick="openPurchaseModal('Primary C&SB account','$1,000','C&SB core account')">Purchase primary account · demo</button></article><article class="panel purchase-card"><span class="case-id">ACCOUNT SETUP AVAILABLE AMOUNT · 5 + 1</span><h3>Assigned account available amount</h3><div class="purchase-price">$1,000<small>initial equity per account assignment</small></div><div class="purchase-feature">✓ 5 progressive additional account slots</div><div class="purchase-feature">✓ Potential 1 sub-management account</div><div class="purchase-feature">✓ Each assigned to an eligible participant</div><button class="primary-btn" onclick="toast('Additional account assignment request recorded in demo mode')">Add account assignment · demo</button></article></div><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Account setup</h3><p>Every account is a account assignment node, not a separate package sale.</p></div></div><div class="account assignment"><div class="node"><small>PRIMARY</small><strong>1 × $1,000 initial equity</strong></div><div class="connector">→</div><div class="node"><small>ADDITIONAL SLOTS</small><strong>Up to 5 × $1,000</strong></div><div class="connector">→</div><div class="node"><small>SUB-MANAGEMENT</small><strong>Potential 1 × $1,000</strong></div></div></section><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Account Account map</h3><p>Initial equity basis is the same; ownership, manager, origin, permissions, and recovery responsibility differ.</p></div><button class="secondary-btn" onclick="setView('accounts')">Open managed accounts →</button></div>${accountTable(accounts)}</section>`}

function recoveryView(){return `${header('RECOVERY ENGINE','Recovery cases','A loss opens a governed process — it does not invent cash.','<button class="primary-btn lime-btn" onclick="openCaseModal()">+ Create case</button>')}<div class="grid two-col"><section class="panel case-card"><div class="case-top"><div><span class="case-id">${recovery.id}</span><h3>${recovery.account}</h3><p>Responsible manager · ${recovery.manager}</p></div>${status(recovery.status)}</div><div class="case-stats"><div class="case-stat"><span>QUALIFYING LOSS</span><strong class="down">-${money(recovery.loss).slice(1)}</strong></div><div class="case-stat"><span>ELIGIBLE AVAILABLE AMOUNT</span><strong>${money(recovery.capacity)}</strong></div><div class="case-stat"><span>ALLOCATED</span><strong>${money(recovery.allocated)}</strong></div></div><p class="kpi-meta">Recovery available amount is based on eligible, realized, contractually interceptable earnings. Notional account value is excluded.</p><div class="steps">${['Event logged','Eligibility review','Approvals','Allocation','Settlement'].map((x,i)=>`<div class="step ${i<recovery.step?'done':i===recovery.step?'current':''}">${x}</div>`).join('')}</div><button class="primary-btn" onclick="advanceCase()">Advance demo status</button></section><section class="panel"><div class="panel-head"><div><h3>Required gates</h3><p>Nothing allocates before each gate is satisfied.</p></div></div><div class="metric-row"><span>Responsible manager confirmation</span>${status('Approved')}</div><div class="metric-row"><span>Participant consent</span>${status('Pending')}</div><div class="metric-row"><span>Partner authority</span>${status('Pending')}</div><div class="metric-row"><span>Compliance review</span>${status('Review')}</div><div class="metric-row"><span>Realized earnings only</span>${status('Enforced')}</div></section></div>`}
function earningsView(){return `${header('LEDGER / ELIGIBILITY','Earnings ledger','A channel is not cash until it is realized, eligible, and allocated once.','<button class="secondary-btn" onclick="toast(\'Ledger export prepared for demo\')">Export view</button>')}<div class="grid kpi-grid"><div class="panel kpi"><span class="kpi-label">GROSS EARNINGS</span><div class="kpi-value">$7,018</div><span class="kpi-meta">5 origins in the graph</span></div><div class="panel kpi"><span class="kpi-label">ELIGIBLE NOW</span><div class="kpi-value">$6,080</div><span class="kpi-meta up">2 origins available</span></div><div class="panel kpi"><span class="kpi-label">RESERVED</span><div class="kpi-value">$0</div><span class="kpi-meta">No allocation made</span></div><div class="panel kpi"><span class="kpi-label">DOUBLE-COUNT CHECK</span><div class="kpi-value">PASS</div><span class="kpi-meta up">Ledger reconciled</span></div></div><section class="panel"><div class="panel-head"><div><h3>Potential income sources</h3><p>Eligibility is a decision state, not a promise of payment.</p></div></div><div class="ledger-row head"><span>ORIGIN</span><span>GROSS</span><span>ELIGIBILITY</span><span>STATE</span></div>${earnings.map(e=>`<div class="ledger-row"><span class="origin">${e[0]}<small>${e[1]}</small></span><span class="amount">${e[2]}</span><span>${status(e[3])}</span><span>${e[4]}</span></div>`).join('')}</section>`}
function conflictsView(){return `${header('CONTROL RULES','Pair conflicts','The execution layer is authoritative. This prototype surfaces the decision, it does not close trades.','<button class="secondary-btn" onclick="toast(\'Conflict scan completed at 10:18\')">Run scan</button>')}<div class="grid two-col"><section class="panel"><div class="panel-head"><div><h3>Open conflicts</h3><p>2 events require inspection</p></div><span class="badge bad">1 critical</span></div><div class="alert"><div class="alert-mark red">!</div><div><strong>EUR/USD · same direction</strong><p>ACC-001 BUY and ACC-003 BUY · Floating result +$820</p><a onclick="openConflictModal('EUR/USD · ACC-001 / ACC-003')">Inspect detail →</a></div></div><div class="alert"><div class="alert-mark amber">△</div><div><strong>GBP/USD · opposing direction</strong><p>ACC-002 SELL and ACC-006 BUY · Floating result -$140</p><a onclick="openConflictModal('GBP/USD · ACC-002 / ACC-006')">Inspect detail →</a></div></div></section><section class="panel"><div class="panel-head"><div><h3>Control posture</h3><p>Server-side enforcement required for production.</p></div></div><div class="metric-row"><span>Positions monitored</span><strong>18</strong></div><div class="metric-row"><span>Pairs scanned</span><strong>12</strong></div><div class="metric-row"><span>Last scan</span><strong>10:18 · 04 Oct</strong></div><div class="metric-row"><span>Front-end enforcement</span>${status('Disabled')}</div></section></div><section class="panel account assignment"><div class="node"><small>ACCOUNT A</small><strong>ACC-001 · Core Account</strong></div><div class="connector">↔</div><div class="node"><small>CONFLICT RULE</small><strong>Identical or opposing pair exposure</strong></div><div class="connector">↔</div><div class="node"><small>ACCOUNT B</small><strong>ACC-003 · Partner Account</strong></div></section>`}
function auditView(){return `${header('SYSTEM OF RECORD','Audit timeline','An immutable demonstration trail of decisions, actors, and state changes.','<button class="secondary-btn" onclick="toast(\'Audit view is already reconciled\')">Reconcile</button>')}<section class="panel"><div class="panel-head"><div><h3>Recent events</h3><p>All timestamps shown in West Africa Time (WAT)</p></div><span class="badge good">Integrity check passed</span></div><div style="padding:20px 0">${audit.map(x=>`<div class="audit-item"><div class="audit-time">${x[0]}</div><div class="audit-marker"></div><div class="audit-copy"><strong>${x[1]}</strong><p>${x[2]} · ${x[3]}</p></div></div>`).join('')}</div></section>`}
function accountDetail(a){openModal(`<div class="modal-header"><h2>${a.name} <span class="case-id">${a.id}</span></h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="grid two-col"><div class="node"><small>EQUITY</small><strong>${money(a.equity)}</strong></div><div class="node"><small>DRAWDOWN</small><strong>${a.drawdown}</strong></div></div><div class="account assignment" style="padding:18px 0"><div class="node"><small>MANAGER</small><strong>${a.owner}</strong></div><div class="connector">→</div><div class="node"><small>PARTNER</small><strong>${a.partner}</strong></div></div><div class="metric-row" style="padding:13px 0"><span>Strategy</span><strong>${a.strategy}</strong></div><div class="metric-row" style="padding:13px 0"><span>Recovery association</span><strong>${a.status==='At risk'?recovery.id:'None active'}</strong></div><div class="modal-actions"><button class="secondary-btn" onclick="closeModal()">Close</button><button class="primary-btn" onclick="toast('Account assignment details copied');closeModal()">Copy summary</button></div></div>`)}
function openPurchaseModal(name,price,partner){openModal(`<div class="modal-header"><h2>Purchase primary account · demo</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><span class="case-id">MOCK CHECKOUT · NO PAYMENT</span><h3 style="margin:12px 0 5px">${name}</h3><p class="kpi-meta">${price} starting deposit · Partner placeholder: ${partner}</p><div class="field"><label>ASSIGN TO MANAGER</label><select><option>Amara Okafor · CEO</option><option>Daniel Mensah · Manager</option><option>Unassigned</option></select></div><div class="field"><label>ACCOUNT LABEL</label><input value="New ${name}" /></div><div class="panel" style="padding:12px;background:#f7f9fa"><strong>Demo confirmation</strong><p class="kpi-meta" style="margin:5px 0 0">This only records the primary account account assignment in the prototype. It does not charge, purchase, or activate a real broker or prop-firm account.</p></div><div class="modal-actions"><button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="primary-btn lime-btn" onclick="closeModal();toast('Demo account added to onboarding queue')">Confirm demo purchase</button></div></div>`)}function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackdrop').classList.add('open')}function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}function openAccount(id){accountDetail(accounts.find(a=>a.id===id))}function openCaseModal(){openModal(`<div class="modal-header"><h2>Create recovery case</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><p class="kpi-meta">Start a governed demo case from a qualifying loss event. No funds move in this prototype.</p><div class="field"><label>ACCOUNT</label><select id="caseAccount">${accounts.map(a=>`<option>${a.id} · ${a.name}</option>`).join('')}</select></div><div class="field"><label>QUALIFYING LOSS</label><input id="caseLoss" type="number" value="7100" /></div><div class="field"><label>EVENT NOTE</label><textarea id="caseNote">Major-loss threshold crossed; eligibility review required.</textarea></div><div class="modal-actions"><button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="primary-btn lime-btn" onclick="createCase()">Create case</button></div></div>`)}function createCase(){recovery.id='RCV-2026-005';recovery.account=document.getElementById('caseAccount').value;recovery.loss=Number(document.getElementById('caseLoss').value||0);recovery.status='Event logged';recovery.step=0;closeModal();setView('recovery');toast('Recovery case created in demo mode')}function advanceCase(){if(recovery.step<4)recovery.step++;recovery.status=['Event logged','Eligibility review','Approvals','Allocation','Settlement'][recovery.step];render();toast('Demo status advanced: '+recovery.status)}function openConflictModal(label){openModal(`<div class="modal-header"><h2>Conflict detail</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><span class="case-id">PAIR CONFLICT · ${label}</span><h3 style="margin:12px 0">Action required before production</h3><p class="kpi-meta">The broker/exchange execution layer must be treated as authoritative. The production rule will define whether identical pairs, opposing directions, pending orders, and partially filled positions are included.</p><div class="metric-row" style="padding:13px 0"><span>Prototype response</span><strong>Flag + audit</strong></div><div class="metric-row" style="padding:13px 0"><span>Live trade termination</span>${status('Not managed')}</div><div class="modal-actions"><button class="primary-btn" onclick="closeModal()">Acknowledge</button></div></div>`)}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function setView(v){view=v;query='';document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));render();document.getElementById('sidebar').classList.remove('open')}function render(){document.getElementById('pageTitle').textContent=titles[view];content.innerHTML={overview,accounts:accountsView,purchase:purchaseView,recovery:recoveryView,earnings:earningsView,conflicts:conflictsView,audit:auditView}[view]()}document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>setView(n.dataset.view)));document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});render();

</script>
</body>
</html>
